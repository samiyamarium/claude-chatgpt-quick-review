<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompting & Architecture 2026: Technical Master Study Suite</title>
    <style>
        :root {
            --bg-primary: #121019;
            --bg-card: #1c1827;
            --bg-card-hover: #2a243a;
            --violet-main: #a855f7;
            --violet-glow: #c084fc;
            --violet-light: #e9d5ff;
            --ash-grey: #94a3b8;
            --ash-light: #cbd5e1;
            --ash-dark: #334155;
            --text-main: #f8fafc;
            --border-color: #3b334d;
            --success-color: #34d399;
            --error-color: #f87171;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            color: var(--violet-glow);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
        }

        .subtitle {
            color: var(--ash-light);
            font-size: 1.15rem;
            font-weight: 500;
        }

        .section-title {
            color: var(--violet-glow);
            font-size: 1.8rem;
            margin: 2.5rem 0 1.5rem 0;
            border-left: 4px solid var(--violet-main);
            padding-left: 0.75rem;
        }

        /* Grid Layouts */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            background: var(--bg-card-hover);
            border-color: var(--violet-main);
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.2);
        }

        .card-number {
            color: var(--violet-light);
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        .card-title {
            color: var(--violet-glow);
            font-size: 1.2rem;
            margin-bottom: 0.75rem;
        }

        .card-preview {
            color: var(--ash-grey);
            font-size: 0.95rem;
            margin-bottom: 1rem;
        }

        .card-btn {
            align-self: flex-start;
            background: transparent;
            color: var(--violet-light);
            border: 1px solid var(--violet-main);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .card:hover .card-btn {
            background: var(--violet-main);
            color: var(--bg-primary);
        }

        /* Modal / Pop-up Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(18, 16, 25, 0.88);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--violet-main);
            border-radius: 16px;
            max-width: 820px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.25);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 2rem;
            color: var(--ash-grey);
            cursor: pointer;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--violet-light);
        }

        .modal-title {
            color: var(--violet-glow);
            font-size: 1.75rem;
            margin-bottom: 1rem;
            padding-right: 2rem;
        }

        .modal-body {
            color: var(--text-main);
            font-size: 1rem;
            line-height: 1.7;
        }

        .modal-body ul, .modal-body ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .modal-body li {
            margin-bottom: 0.5rem;
        }

        .modal-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
            font-size: 0.9rem;
        }

        .modal-body th, .modal-body td {
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            text-align: left;
        }

        .modal-body th {
            background: var(--bg-primary);
            color: var(--violet-glow);
        }

        .modal-body code {
            background: var(--bg-primary);
            color: var(--violet-light);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: monospace;
        }

        .modal-body pre {
            background: var(--bg-primary);
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid var(--border-color);
        }

        /* Quiz Styling */
        .quiz-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            margin-top: 2rem;
        }

        .quiz-question {
            background: rgba(18, 16, 25, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }

        .q-title {
            color: var(--violet-glow);
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .q-options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            border-color: var(--violet-main);
            background: var(--bg-card-hover);
        }

        .option-label input[type="radio"] {
            accent-color: var(--violet-main);
            width: 18px;
            height: 18px;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--violet-main), var(--ash-grey));
            color: var(--bg-primary);
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 1rem;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        /* Results Display */
        #quiz-results {
            display: none;
            margin-top: 2rem;
            padding: 2rem;
            background: var(--bg-card);
            border-radius: 16px;
            border: 2px solid var(--violet-main);
        }

        .score-banner {
            text-align: center;
            margin-bottom: 2rem;
        }

        .score-text {
            font-size: 2.2rem;
            color: var(--violet-glow);
            font-weight: bold;
        }

        /* Glitching Shining Star Animation */
        .star-container {
            display: none;
            text-align: center;
            margin: 1.5rem 0;
        }

        .glitch-star {
            font-size: 5rem;
            display: inline-block;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px var(--violet-main), 0 0 30px var(--violet-glow), 0 0 40px var(--violet-glow);
            animation: pulse 1.5s infinite alternate, glitch 0.3s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        @keyframes glitch {
            0% { transform: translate(0) scale(1.1); filter: hue-rotate(0deg); }
            20% { transform: translate(-3px, 3px) scale(1.15); }
            40% { transform: translate(-3px, -3px) scale(1.08); filter: hue-rotate(90deg); }
            60% { transform: translate(3px, 3px) scale(1.12); }
            80% { transform: translate(3px, -3px) scale(1.1); filter: hue-rotate(180deg); }
            100% { transform: translate(0) scale(1.15); filter: hue-rotate(360deg); }
        }

        .answer-key {
            margin-top: 2rem;
        }

        .key-item {
            background: var(--bg-primary);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--border-color);
        }

        .key-item.correct {
            border-left-color: var(--success-color);
        }

        .key-item.incorrect {
            border-left-color: var(--error-color);
        }

        .key-q {
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 0.5rem;
        }

        .key-status {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .key-status.correct { color: var(--success-color); }
        .key-status.incorrect { color: var(--error-color); }

        .key-explanation {
            font-size: 0.95rem;
            color: var(--ash-grey);
            margin-top: 0.5rem;
        }

        .diagram-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            margin: 1rem 0;
            text-align: center;
        }

        .diagram-box svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>

// --- INITIALIZATION & DOM RENDERING ---

document.addEventListener('DOMContentLoaded', () => {
    renderCards();
    renderQuiz();
});

// Render Concept Cards
function renderCards() {
    const container = document.getElementById('cards-container');
    container.innerHTML = conceptsData.map(c => `
        <div class="card" onclick="openModal(${c.id})">
            <div>
                <div class="card-number">CONCEPT ${c.id}</div>
                <div class="card-title">${c.title}</div>
                <div class="card-preview">${c.preview}</div>
            </div>
            <button class="card-btn">Read Briefing &rarr;</button>
        </div>
    `).join('');
}

// Modal Handlers
function openModal(id) {
    const concept = conceptsData.find(c => c.id === id);
    if (!concept) return;

    document.getElementById('modal-title').innerText = `Concept ${concept.id}: ${concept.title}`;
    document.getElementById('modal-body').innerHTML = concept.content;
    document.getElementById('modal-overlay').style.display = 'flex';
    document.body.style.overflow = 'hidden';
}

function closeModal(event = null, force = false) {
    if (force || (event && event.target.id === 'modal-overlay')) {
        document.getElementById('modal-overlay').style.display = 'none';
        document.body.style.overflow = 'auto';
    }
}

// Render Quiz Questions
function renderQuiz() {
    const container = document.getElementById('quiz-questions-container');
    container.innerHTML = quizQuestions.map((q, idx) => `
        <div class="quiz-question" id="question-box-${idx}">
            <div class="q-title">${idx + 1}. ${q.question}</div>
            <div class="q-options">
                ${q.options.map((opt, optIdx) => `
                    <label class="option-label">
                        <input type="radio" name="question-${idx}" value="${optIdx}">
                        <span>${opt}</span>
                    </label>
                `).join('')}
            </div>
        </div>
    `).join('');
}

// Quiz Evaluation Logic
function evaluateQuiz() {
    let score = 0;
    const keyContainer = document.getElementById('answer-key-container');
    keyContainer.innerHTML = '<h3>Detailed Evaluation & Answer Key</h3>';

    quizQuestions.forEach((q, idx) => {
        const selected = document.querySelector(`input[name="question-${idx}"]:checked`);
        const userChoice = selected ? parseInt(selected.value) : -1;
        const isCorrect = userChoice === q.answer;

        if (isCorrect) {
            score++;
        }

        const userAnsText = userChoice !== -1 ? q.options[userChoice] : "None Selected";
        const correctAnsText = q.options[q.answer];

        const keyItem = document.createElement('div');
        keyItem.className = `key-item ${isCorrect ? 'correct' : 'incorrect'}`;
        keyItem.innerHTML = `
            <div class="key-q">${idx + 1}. ${q.question}</div>
            <div class="key-status ${isCorrect ? 'correct' : 'incorrect'}">
                ${isCorrect ? '✓ Correct' : '✗ Incorrect'}
            </div>
            <div><strong>Your Answer:</strong> ${userAnsText}</div>
            ${!isCorrect ? `<div><strong>Correct Answer:</strong> ${correctAnsText}</div>` : ''}
            <div class="key-explanation"><strong>Technical Context:</strong> ${q.explanation}</div>
        `;
        keyContainer.appendChild(keyItem);
    });

    document.getElementById('score-display').innerText = `${score} / ${quizQuestions.length}`;
    
    const starBox = document.getElementById('star-box');
    if (score >= 24) {
        starBox.style.display = 'block';
    } else {
        starBox.style.display = 'none';
    }

    const resultsBox = document.getElementById('quiz-results');
    resultsBox.style.display = 'block';
    resultsBox.scrollIntoView({ behavior: 'smooth' });
}
</script>
